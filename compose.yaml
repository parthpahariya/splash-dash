name: the-last-sail

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: the-last-sail-web:latest
    develop:
      watch:
        - action: rebuild
          path: ./web
        - action: rebuild
          path: ./docker
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:80"
    stop_grace_period: 15s
    restart: unless-stopped
