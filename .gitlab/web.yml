# Website (thelastsail.boringman.in) check and deploy. See docs/web-deployment.md.
.web-changes: &web-changes
  - web/**/*
  - docker/**/*
  - deploy/**/*
  - ci/check-web.sh
  - compose.yaml
  - compose.production.yaml
  - .dockerignore
  - Makefile
  - .gitlab/web.yml

web-check:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - changes: *web-changes
  image: docker:28-cli
  timeout: 15m
  services:
    - name: docker:28-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash openssl
  script:
    - bash ci/check-web.sh

web-deploy:
  stage: deploy
  needs: [web-check]
  image: python:3.13-bookworm
  timeout: 30m
  interruptible: false
  resource_group: the-last-sail-website
  environment:
    name: website
    url: https://thelastsail.boringman.in
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
      changes: *web-changes
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssh-client
  script:
    - bash deploy/ci-deploy.sh gitlab
