# GitLab CI/CD entry point. Set Settings → CI/CD → General pipelines →
# CI/CD configuration file to .gitlab/.gitlab-ci.yml.
# Jobs call the same scripts as GitHub Actions (.github/scripts/).
workflow:
  rules:
    # iOS release tags run only the iOS release job.
    - if: '$CI_COMMIT_TAG =~ /^ios-v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $RELEASE_BRANCH'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - deploy

# Android and iOS CI/CD stay in their own files.
include:
  - local: .gitlab/android.yml
  - local: .gitlab/ios.yml

default:
  interruptible: true

variables:
  # Branch whose Android changes build a Google Play release.
  RELEASE_BRANCH: codex/splash-dash-2026-11-25
