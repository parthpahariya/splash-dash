# Serves the static website in web/. Host nginx terminates TLS and proxies here
# (see deploy/nginx.conf).
server {
    listen 80;
    server_name _;
    access_log off;
    server_tokens off;
    # Relative redirects (for example /privacy -> /privacy/) keep the public
    # https://thelastsail.boringman.in origin behind the TLS proxy.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    # Locations below must not use add_header, or these server-level headers are dropped.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location = /web-health {
        return 204;
    }

    # Cache-Control: no-cache. Browsers revalidate on every visit (a cheap 304 via ETag), so a
    # deploy is visible at once and pages, stylesheet and images never mix versions.
    expires -1;

    location / {
        try_files $uri $uri/ =404;
    }
}
