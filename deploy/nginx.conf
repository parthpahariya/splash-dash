# Installed as /etc/nginx/conf.d/the-last-sail.conf.
# No default_server: this VM may also host Meal Manager, which owns the default server.

# Keep HTTP available for certificate validation and renewal.
server {
    listen 80;
    listen [::]:80;
    server_name thelastsail.boringman.in;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://thelastsail.boringman.in$request_uri;
    }
}

# Host TLS termination. The web container serves the static website.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name thelastsail.boringman.in;
    ssl_certificate /etc/letsencrypt/live/thelastsail.boringman.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thelastsail.boringman.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
